name: cursos-online
services:  
  postgres:    
    image: postgres:16-alpine    
    container_name: cursos-online    
    environment:      
      POSTGRES_DB: projeto      
      POSTGRES_USER: projeto      
      POSTGRES_PASSWORD: projeto    
    ports:      
      - "5437:5432"    
    volumes:      
      - postgres_data:/var/lib/postgresql/data    
    healthcheck:      
      test: ["CMD-SHELL", "pg_isready -U projeto -d projeto"]      
      interval: 5s      
      timeout: 5s      
      retries: 5

volumes:  
  postgres_data:
